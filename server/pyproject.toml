[project]
name = "docmind-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi==0.141.1",
    "python-multipart==0.0.32",      # required by UploadFile / File(...)
    "pydantic==2.13.4",
    "email-validator==2.3.0",        # required by EmailStr
    "pydantic-settings==2.15.0",

    # Database
    "SQLAlchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "pgvector==0.5.0",

    # Auth
    "python-jose[cryptography]==3.5.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",                 # passlib's bcrypt backend, see note below

    # External services
    "google-genai==2.28.0",
    "cohere==7.0.8",
    "cloudinary==1.45.0",
    "requests==2.34.2",

    # Document parsing
    "pypdf==6.16.1",
]

[dependency-groups]
dev = [
    "uvicorn[standard]==0.52.2",
    "black==26.5.1",
    "ruff==0.16.2",
    "types-requests==2.33.0.20260712",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "E501"]